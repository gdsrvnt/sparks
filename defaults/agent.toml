# agent.toml: the golden example for .sparks/agents.toml.
#
# A project keeps its agent personas in .sparks/agents.toml. The
# agent-personas skill (/agent-personas) creates that file from this one and
# maintains it. `sparks agent spawn <name>` reads one persona from it and
# launches it as a pi session in a new herdr tab, in the caller's directory.
# spawn uses the nearest .sparks/agents.toml: the current directory first,
# then each parent up to the git top level (the first directory with a .git),
# or up to the filesystem root outside a git repository. This file and its
# .sparks directory must be owned by the user who runs spawn and must not be
# writable by group or others; spawn refuses them otherwise.
#
# A name this file does not define, or a missing file, falls back to the
# personas the plugin ships in defaults/agents.toml: spec-writer, implementer,
# and reviewer. A table here with one of those names replaces it whole.
#
# Each persona is one table. The table name is the persona's name and id, and
# it is what you pass to `sparks agent spawn`: a lowercase letter, then up to
# 26 lowercase letters, digits, `-`, or `_`. The launched herdr agent is named
# <name>-<4 random hex digits>.
#
# spawn is a thin wrapper over `herdr agent start <name> --kind pi -- <pi
# arguments>`: each key below becomes the pi flag named next to it, as pi
# documents it in `pi --help` and its docs/cli.md (sections "Tools",
# "Resources", and "Prompts and process").
#
# String keys (no other keys are allowed):
#
#   name           Optional. The persona's name again, for readers. It must
#                  equal the table name.
#   role           Required. What the persona is for, in one line. For people
#                  and skills reading this file; it is not sent to pi.
#   model_type     Required. A model type from the plugin's
#                  defaults/model-types.toml (value, powerful, fast) or the
#                  project's .sparks/model-types.toml. The type lists pi
#                  provider, model, effort, and service tier combos to try in
#                  order, and the types to fall back to. See that file.
#   model          Optional. A pi model id exactly as `pi --list-models`
#                  prints it, tried before the model type's combos. No
#                  thinking suffix such as `:high` and no speed such as
#                  `fast`. Needs effort. Sent as pi's --model.
#   effort         Required with model, refused without it. none, minimal,
#                  low, medium, high, xhigh ("extra high", "extra-high", and
#                  "extrahigh" are the same), or max. Sent as pi's --thinking;
#                  none is sent as off. ultra is refused: pi has no ultra
#                  level. A model that pi lists without thinking only takes
#                  none.
#   provider       Optional, only with model. The pi provider, as in the
#                  provider column of `pi --list-models`. Without it, spawn
#                  refuses and lists the providers when more than one serves
#                  the model. Sent as pi's --provider.
#   system_prompt  Optional. Text appended to pi's system prompt with
#                  --append-system-prompt, so pi's own prompt and tools stay.
#                  One line, with no tabs: herdr cannot type a newline or a
#                  tab into the shell. In a """ string, end each line with \
#                  to join the lines. It must not be the path of an existing
#                  file: pi would read that file instead.
#   agent          Optional. The harness that runs the persona. Only "pi",
#                  the default, is supported.
#
# List keys (lists of strings; leave a key out for pi's own default):
#
#   allowed_tools        Tool names or * patterns. Sent as pi's --tools,
#                        which replaces pi's default tools with exactly these
#                        (read, bash, edit, write, grep, find, ls, and
#                        extension tools). [] is --no-tools. No +name/-name
#                        entries and no mcp__ entries: use allowed_mcp.
#                        With allowed_mcp or forbidden_mcp set, entries with
#                        * or ? are refused (they could bypass MCP selection).
#   forbidden_tools      Tool names or * patterns. Sent as --exclude-tools,
#                        which pi applies after every other tool option.
#   allowed_mcp          MCP server names (sent as mcp__<server>__*) or
#                        mcp__ patterns, added to the --tools list: pi keeps
#                        every MCP tool unless a --tools entry starts with
#                        mcp__. A non-empty list needs allowed_tools, because
#                        --tools also replaces the default tools.
#                        [] is --no-mcp: no MCP server connects.
#   forbidden_mcp        MCP server names or mcp__ patterns, added to
#                        --exclude-tools.
#                        With either MCP key set (even empty), resource tools
#                        list_mcp_resources, list_mcp_resource_templates, and
#                        read_mcp_resource are excluded unless each is listed
#                        literally in allowed_tools. That explicit opt-in
#                        permits resources on ALL enabled servers: pi cannot
#                        filter resource arguments by these server policies.
#   skills               Skill names. Sent as --no-skills, then --skill <dir>
#                        for each, so the persona sees only these skills.
#                        [] loads no skill. Each name is looked up, first
#                        match wins, in .pi/skills/<name> and
#                        .agents/skills/<name> from the current directory up
#                        to the git top level, then the plugin's
#                        skills/<name>, then $PI_CODING_AGENT_DIR (default
#                        ~/.pi/agent)/skills/<name> and ~/.agents/skills/<name>.
#                        spawn refuses a name it cannot find. Skills need the
#                        read or bash tool to load.
#   allowed_directories  Directories the persona may read, write, and edit
#                        in, relative to the working directory or absolute.
#                        Sent only as an instruction in the system prompt:
#                        pi has no sandbox and does NOT enforce it.
#
# Every launch also gets two more pi arguments from spawn:
#   -e <plugin>/pi/extensions/sparks-api-error-blocked.ts, which tells herdr
#     when a request ends in an API error so spawn can fall back; and
#   --append-system-prompt with the sparks prompt: read the sparks.json of
#     every directory it will read or write, and at the end of its task
#     verify its diff against the repository-root sparks.json and the
#     sparks.json of every directory the diff touches, write a task-scoped
#     verification procedure in a confirmed gitignored location such as
#     .sparks/verify/<task>.md, then run it and report. Read-only/restricted
#     personas provide an explicit handoff to the summoner to persist/run it;
#     they must not claim they created an artifact they could not write.
# Because spawn always passes --append-system-prompt, pi's APPEND_SYSTEM.md
# (.pi/APPEND_SYSTEM.md or ~/.pi/agent/APPEND_SYSTEM.md) never applies to a
# spawned persona: pi reads that file only when no --append-system-prompt is
# given. pi's SYSTEM.md is not affected.
#
# There is no speed key. Leave an optional key out rather than setting it to "".
#
# Examples (uncomment to use):
#
# [critic]
# name = "critic"
# role = "Reviews a pull request against the project's sparks"
# model_type = "powerful"
# model = "claude-opus-5"
# provider = "anthropic"
# effort = "high"
# agent = "pi"
# skills = ["spark-verification"]
# forbidden_tools = ["edit", "write"]
# allowed_mcp = []
# system_prompt = """\
# You review changes. Read the diff and every sparks.json that applies to the \
# changed files, and report each violation with the file and the quoted spark. \
# Do not edit files.\
# """
#
# [builder]
# name = "builder"
# role = "Implements a scoped task and runs the tests"
# model_type = "value"
# allowed_tools = ["read", "bash", "edit", "write", "grep"]
# allowed_directories = ["src", "tests"]
