name: upstream-tracker

# Daily check of upstream skill sources pinned in .github/upstreams.json.
# On a new version, POSTs to the webhook unless a discussion
# "upstream: <upstream> <new_version>" already exists. Never commits; pins change only via PR.

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  discussions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/upstreams.json
          sparse-checkout-cone-mode: false
      - name: Check upstreams
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WEBHOOK_URL: ${{ secrets.UPSTREAM_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.UPSTREAM_WEBHOOK_KEY }}
          WEBHOOK_HEADER: ${{ secrets.UPSTREAM_WEBHOOK_HEADER }}
        run: bash .github/upstream-check.sh .github/upstreams.json
