name: archagents-mention

# Forwards GitHub events to the Grok Bot webhook when GoddyB mentions @ArchAgents,
# or requests a review from ArchAgents on a pull request (no text to match).
# commit_comment is not a supported Actions trigger, so commit comments are not covered.
# Uses pull_request_target so secrets are available; PR code is never checked out.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited, review_requested]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created]

permissions:
  contents: read

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: >-
      github.actor == 'GoddyB' && (
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@ArchAgents') || contains(github.event.issue.title, '@ArchAgents'))) ||
        (github.event_name == 'pull_request_target' && github.event.action != 'review_requested' && (contains(github.event.pull_request.body, '@ArchAgents') || contains(github.event.pull_request.title, '@ArchAgents'))) ||
        (github.event_name == 'pull_request_target' && github.event.action == 'review_requested' && github.event.requested_reviewer.login == 'ArchAgents') ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@ArchAgents')) ||
        (github.event_name == 'discussion' && (contains(github.event.discussion.body, '@ArchAgents') || contains(github.event.discussion.title, '@ArchAgents'))) ||
        ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment' || github.event_name == 'discussion_comment') && contains(github.event.comment.body, '@ArchAgents'))
      )
    steps:
      - name: Forward event to webhook
        env:
          EVENT_NAME: ${{ github.event_name }}
          WEBHOOK_URL: ${{ secrets.UPSTREAM_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.UPSTREAM_WEBHOOK_KEY }}
          WEBHOOK_HEADER: ${{ secrets.UPSTREAM_WEBHOOK_HEADER }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ] || [ -z "${WEBHOOK_HEADER:-}" ]; then
            echo "::error::MENTION_WEBHOOK_URL and MENTION_WEBHOOK_HEADER must be set"
            exit 1
          fi
          # MENTION_WEBHOOK_HEADER may be the full header line ("Authorization: Bearer <key>"), as the routine panel shows it.
          case "$WEBHOOK_HEADER" in
            *:*) auth_header="$WEBHOOK_HEADER" ;;
            *)
              if [ -z "${WEBHOOK_KEY:-}" ]; then
                echo "::error::MENTION_WEBHOOK_KEY must be set when MENTION_WEBHOOK_HEADER is only a header name"
                exit 1
              fi
              auth_header="${WEBHOOK_HEADER}: ${WEBHOOK_KEY}" ;;
          esac
          jq -n --arg event_name "$EVENT_NAME" --slurpfile payload "$GITHUB_EVENT_PATH" \
            '{event_name: $event_name, payload: $payload[0]}' > "$RUNNER_TEMP/body.json"
          curl --fail-with-body -sS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "$auth_header" \
            --data-binary "@$RUNNER_TEMP/body.json"
